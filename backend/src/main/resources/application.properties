server.port=8080
# La IP privada de la EC2 de BD llega por variable de entorno (DB_HOST)
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:1433;databaseName=cafeteria;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:Cafe_Pass123!}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
